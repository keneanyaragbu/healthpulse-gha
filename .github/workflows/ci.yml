name: HealthPulse Backend CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: healthpulse-backend
  AWS_REGION: us-east-1
  ECR_REGISTRY: 588738574057.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: healthpulse-backend

jobs:
  build:
    name: Build, Scan, Sign, Push
    runs-on: ubuntu-latest

    steps:
      # ---- 1. Checkout ----
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- 2. Node setup + unit tests ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app/backend
        run: npm ci

      - name: Run unit tests
        working-directory: app/backend
        run: npm test

      # ---- 3. SonarCloud scan ----
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: app/backend

      # ---- 4. SonarCloud Quality Gate (the GATE, not just the scan) ----
      - name: SonarCloud Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: app/backend/.scannerwork/report-task.txt

      # ---- 5. Snyk dependency scan (gate on critical) ----
      - name: Run Snyk dependency scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical --file=app/backend/package.json

      # ---- 6. Build image (local, SHA-tagged — NOT pushed yet) ----
      - name: Build Docker image
        working-directory: app/backend
        run: |
          IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE_URI .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # ---- 7. Trivy scan the LOCAL image (BEFORE push — gate on critical) ----
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      # ---- 8. Smoke test the LOCAL image ----
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 ${{ env.IMAGE_URI }}
          sleep 5
          curl --fail http://localhost:3000/api/health || (docker logs smoke && exit 1)
          docker rm -f smoke
          echo "Smoke test passed"

      # ======== GATE PASSED — only now do we touch the registry ========

      # ---- 9. AWS auth ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---- 10. Install cosign ----
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # ---- 11. Push + Sign (combined, as you designed) ----
      - name: Push to ECR and sign with cosign
        run: |
          docker push ${{ env.IMAGE_URI }}

          # Capture the digest (sign + deploy by DIGEST, the immutable identity)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_URI }} | cut -d'@' -f2)
          IMAGE_DIGEST_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@$DIGEST
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV

          # Sign the image by digest (signature stored in ECR)
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY $IMAGE_DIGEST_URI
          echo "Pushed and signed: $IMAGE_DIGEST_URI"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}